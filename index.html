<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>IDFLIX — Streaming Film</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <a class="logo" href="#/"><svg viewBox="0 0 24 24"><path d="M4 3l17 9-17 9z"/></svg><span>IDF<b>LIX</b></span></a>
      <label class="search-box"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="topSearch" type="search" placeholder="Cari film, judul, atau genre..." autocomplete="off"></label>
      <button class="icon-btn" aria-label="Notifikasi"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg></button>
      <a class="icon-btn avatar" href="#/profile" aria-label="Profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></a>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi utama"></nav>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
